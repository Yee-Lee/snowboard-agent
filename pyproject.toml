[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sbd"
version = "0.1.0"
description = "Snowboard Agent"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyyaml",
    "pillow>=10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "numpy>=1.26",
    "samplerate==0.2.4"
]
rpi-audio = [
    "pyalsaaudio==0.11.0",
    "samplerate==0.2.4"
]

[tool.setuptools.package-data]
"sbd.core.display" = ["assets/fonts/*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
markers = [
    "rpi: Raspberry Pi only tests",
]
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]
